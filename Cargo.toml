[workspace]

[package]
name = "dekopon-chat-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Broker-scoped chat history capabilities for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-chat"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-provider-sdk = "=0.47.0"
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.47.0"
dekopon-http-host = "=0.47.0"
dekopon-capability = "=0.47.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
